<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Freelankarx</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .error-container { max-width: 600px; }
        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1rem; }
        p { color: #A1A1AA; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform .3s;
        }
        .btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>This page got lost in the digital universe</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back to something memorable.</p>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>
</html>
